<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的笔记 · Personal Notes</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='12' height='16' x='2' fill='%23a9713d' rx='1'/%3E%3Cline x1='4' y1='4' x2='12' y2='4' stroke='%23fffdf8' stroke-width='1.5'/%3E%3Cline x1='4' y1='7' x2='12' y2='7' stroke='%23fffdf8' stroke-width='1.5'/%3E%3C/svg%3E" />
</head>
<body class="app-page">
  <header class="topbar">
    <a class="brand" href="index.html">Personal Notes</a>
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="搜索标题…" />
    </div>
    <div class="topbar-right">
      <button id="settingsBtn" class="btn btn-ghost btn-small" title="笔记加密与安全设置">安全设置</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button class="tag-item active" data-tag="">全部笔记</button>
      <div class="sidebar-title">标签</div>
      <div id="tagList"></div>
      <div class="sidebar-add">
        <input id="newTagInput" type="text" maxlength="20" placeholder="新建标签…" />
        <button id="addTagBtn" class="btn btn-small btn-ghost">添加</button>
      </div>

      <div class="sidebar-title">月度记录</div>
      <div class="stats-card">
        <div class="stats-head">
          <button id="statsPrev" class="stats-nav" title="上一月" aria-label="上一月">‹</button>
          <span id="statsMonth" class="stats-month">—</span>
          <button id="statsNext" class="stats-nav" title="下一月" aria-label="下一月">›</button>
        </div>
        <div id="heatmap" class="heatmap"></div>
        <div class="stats-summary">
          <span>本月 <b id="statsCount">0</b> 篇 · <b id="statsWords">0</b> 字</span>
        </div>
        <div class="heatmap-legend">
          <span>少</span>
          <i class="lvl lvl0"></i><i class="lvl lvl1"></i><i class="lvl lvl2"></i><i class="lvl lvl3"></i><i class="lvl lvl4"></i>
          <span>多</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="main-head">
        <h2 id="listTitle">全部笔记</h2>
        <div class="main-head-actions">
          <input id="importFile" type="file" accept=".md,.markdown,text/markdown" multiple class="hidden" />
          <button id="importBtn" class="btn btn-ghost btn-small" title="导入 Markdown 文件">导入</button>
          <button id="exportAllBtn" class="btn btn-ghost btn-small" title="全部导出为 Markdown">导出全部</button>
          <a class="btn btn-primary" href="note-editor.html">写新笔记</a>
        </div>
      </div>
      <div id="noteList" class="note-list"></div>
      <div id="emptyState" class="empty-state hidden">
        <p>这里还很安静，写下第一条笔记吧。</p>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <button id="themeToggle" class="theme-toggle" title="切换夜间模式" aria-label="切换夜间模式">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/notes.js"></script>
</body>
</html>
